<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageLinkMode</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="popup-brand">
          <img src="/icons/icon32.png" alt="" width="28" height="28" />
          <div><strong>PageLinkMode</strong><span>网页导航规则</span></div>
        </div>
        <button id="open-options" type="button" class="icon-button" title="打开规则工作台" aria-label="打开规则工作台">
          <svg data-lucide="sliders-horizontal" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 4H14" /><path d="M10 4H3" /><path d="M21 12H12" /><path d="M8 12H3" /><path d="M21 20H16" /><path d="M12 20H3" />
            <circle cx="12" cy="4" r="2" /><circle cx="10" cy="12" r="2" /><circle cx="14" cy="20" r="2" />
          </svg>
        </button>
      </header>

      <section id="status-band" class="status-band" data-state="managed">
        <div><span id="status-dot" class="status-dot"></span><strong id="status-label">正在读取</strong></div>
        <button id="site-enabled" type="button" class="switch-button" role="switch" aria-checked="true"><span></span></button>
        <p id="popup-status" class="popup-status" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="context-block">
        <span>当前站点</span><strong id="host-value">—</strong>
        <p id="context-summary">正在读取当前页面规则。</p>
        <p id="decision-source">当前命中来源：正在读取</p>
      </section>

      <section class="preset-quick" aria-labelledby="popup-preset-title">
        <div class="preset-quick-head">
          <div><strong id="popup-preset-title">快速预设</strong><span>拖动立即应用基础分类</span></div>
          <output id="popup-preset-label" for="popup-preset-range">适中</output>
        </div>
        <div class="scope-control" style="--scope-progress: 50%">
          <div class="scope-track" aria-hidden="true"></div>
          <input
            id="popup-preset-range"
            class="scope-range"
            type="range"
            min="0"
            max="4"
            step="1"
            value="2"
            aria-label="基础分类快速预设"
            aria-valuetext="适中"
          />
          <div class="scope-scale" aria-hidden="true">
            <span>精准</span>
            <span>内容</span>
            <span>适中</span>
            <span>深入</span>
            <span>最广</span>
          </div>
        </div>
      </section>

      <section class="quick-rule">
        <div class="quick-rule-head"><strong>站点整体规则</strong><span id="site-rule-source">继承基础分类</span></div>
        <div id="site-rule-actions" class="action-group"></div>
      </section>

      <section class="quick-rule">
        <div class="quick-rule-head"><strong>页面整体规则</strong><span id="page-rule-source">继承站点</span></div>
        <div id="page-rule-actions" class="action-group"></div>
      </section>

      <section class="personal-summary">
        <div class="personal-summary-head"><strong>个性化规则</strong><span id="personal-rule-count">当前范围 0 条</span></div>
        <div class="personal-entry-actions">
          <button id="open-site-personal" type="button" class="secondary-button">站点规则</button>
          <button id="open-page-personal" type="button" class="secondary-button">页面规则</button>
        </div>
        <button id="open-personal-rules" type="button" hidden>创建例外</button>
      </section>

    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
